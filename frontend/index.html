<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisionHealth rPPG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: '#0B0E14',
                        neonLime: '#32FF7E',
                    },
                    boxShadow: {
                        clay: 'inset -5px -5px 10px rgba(0,0,0,0.5), inset 5px 5px 10px rgba(255,255,255,0.1)',
                        neon: '0 0 10px #32FF7E, 0 0 20px #32FF7E, 0 0 40px #32FF7E',
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0B0E14; color: white; margin: 0; overflow-x: hidden; font-family: 'Inter', sans-serif; }
        .clay-card {
            background: #11151c;
            border-radius: 20px;
            box-shadow: inset -5px -5px 10px rgba(0,0,0,0.3), inset 5px 5px 10px rgba(255,255,255,0.05);
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .neon-text {
            color: #32FF7E;
            text-shadow: 0 0 5px #32FF7E, 0 0 10px #32FF7E;
        }
        #alert-canvas {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 9999;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div id="root"></div>
    <canvas id="alert-canvas"></canvas>
    <script type="text/babel" src="app.jsx"></script>
</body>
</html>
